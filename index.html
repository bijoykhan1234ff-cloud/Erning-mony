<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আমার আর্নিং</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5fb;color:#183052}
header{background:#075ee8;color:white;padding:22px;font-size:25px;font-weight:bold}
main{padding:16px;max-width:600px;margin:auto}
.balance{background:linear-gradient(120deg,#1742a0,#1479ff);color:white;padding:24px;border-radius:16px;margin-bottom:22px}
.amount{font-size:36px;font-weight:bold;margin:14px 0}
h2{margin-top:24px}
.task{background:white;border-radius:12px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #dce5f4}
button{background:#0861e9;color:white;border:0;border-radius:8px;padding:12px 18px;font-size:16px}
nav{position:sticky;bottom:0;background:white;padding:14px;display:flex;justify-content:space-around;border-top:1px solid #ddd}
</style>
</head>
<body>
<header>আমার আর্নিং</header>
<main>
<section class="balance">
অ্যাকাউন্ট ব্যালেন্স
<div class="amount">৳ 0.00</div>
<button onclick="alert('উত্তোলনের ব্যবস্থা পরবর্তী ধাপে যোগ হবে।')">উত্তোলন</button>
</section>
<h2>ছোট কাজ</h2>
<div class="task"><h3>📅 দৈনিক চেক-ইন</h3><p>প্রতিদিন লগইন করার কাজ।</p></div>
<div class="task"><h3>▶️ ভিডিও দেখুন</h3><p>ভিডিও দেখার কাজ এখানে থাকবে।</p></div>
<div class="task"><h3>📝 সার্ভে পূরণ</h3><p>সার্ভে করার কাজ এখানে থাকবে।</p></div>
</main>
<nav><span>🏠 হোম</span><span>📋 টাস্ক</span><span>🔗 লিংক</span><span>💰 আয়</span><span>👤 অ্যাকাউন্ট</span></nav>
</body>
                            </html>
